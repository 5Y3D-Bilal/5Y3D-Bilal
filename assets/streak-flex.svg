<svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170" role="img" aria-label="Streak: 10 days">
<defs><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14141a"/><stop offset="1" stop-color="#0a0a0d"/></linearGradient>
<linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c6ff00"/><stop offset="1" stop-color="#c6ff00" stop-opacity=".45"/></linearGradient>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<rect x=".5" y=".5" width="819" height="169" rx="16" fill="url(#p)" stroke="#c6ff00" stroke-opacity=".35"/>
<text x="136" y="78" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="800" fill="#fff" >2,310</text><text x="136" y="104" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#c8c8d0" >Total Contributions</text><text x="136" y="126" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b6b75" >Jul 25, 2023 – Present</text>
<line x1="272" y1="28" x2="272" y2="142" stroke="#fff" stroke-opacity=".1"/>
<g transform="translate(410 68)"><circle r="46" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="8"/>
<circle r="46" fill="none" stroke="#c6ff00" stroke-width="8" opacity=".5" filter="url(#gl)" stroke-linecap="round" stroke-dasharray="289.0 999" transform="rotate(-90)"/>
<circle r="46" fill="none" stroke="url(#r)" stroke-width="8" stroke-linecap="round" stroke-dasharray="289.0 999" transform="rotate(-90)"><animate attributeName="stroke-dasharray" from="0 999" to="289.0 999" dur="1.2s" fill="freeze"/></circle>
<text x="0" y="12" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#fff" >10</text></g>
<text x="410" y="138" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#c6ff00" letter-spacing="2">CURRENT STREAK</text><text x="410" y="155" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#6b6b75" >Nov 19 – Nov 28</text>
<line x1="548" y1="28" x2="548" y2="142" stroke="#fff" stroke-opacity=".1"/>
<text x="684" y="78" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="800" fill="#fff" >10</text><text x="684" y="104" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#c8c8d0" >Longest Streak</text><text x="684" y="126" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b6b75" >Feb 22, 2024 – Mar 2, 2024</text>
</svg>