<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Bilal — Full-stack and creative developer from Pakistan">
<defs>
  <clipPath id="r"><rect width="1200" height="320" rx="22"/></clipPath>
  <radialGradient id="g1" cx=".85" cy=".1" r=".8"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2" cx=".1" cy="1" r=".7"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".2"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  <style>
    .m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace}
    .s{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .fade{opacity:0;animation:in .9s ease forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}
    @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
    .orb{animation:f 6s ease-in-out infinite}@keyframes f{50%{transform:translateY(-14px)}}
  </style>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="320" fill="#0a0e14"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#g1)"/>
  <rect width="1200" height="320" fill="url(#g2)"/>

  <text x="56" y="62" class="m fade d1" font-size="13" letter-spacing="3" fill="#64748b">01 — HELLO, WORLD</text>
  <text x="1144" y="62" class="m fade d1" font-size="13" letter-spacing="3" fill="#64748b" text-anchor="end">PK · OPEN TO WORK</text>
  <path d="M56 82H1144" stroke="#1e293b"/>
  <rect y="81" width="140" height="2" fill="#22d3ee"><animate attributeName="x" values="56;1004;56" dur="9s" repeatCount="indefinite"/></rect>

  <g class="fade d2"><text x="56" y="168" class="s" font-size="72" font-weight="800" fill="url(#tx)">I'm Bilal.</text></g>
  <text x="58" y="214" class="s fade d3" font-size="24" fill="#cbd5e1">Full-stack &amp; creative developer — web, desktop &amp; 3D.</text>
  <g class="fade d4">
    <text x="58" y="268" class="m" font-size="16" fill="#22d3ee">$ <tspan fill="#94a3b8">building fast, polished things with TypeScript &amp; Rust</tspan><tspan class="blink" fill="#22d3ee"> ▍</tspan></text>
  </g>

  <g class="orb" transform-origin="980 190">
    <circle cx="980" cy="190" r="70" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0 980 190" to="360 980 190" dur="20s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="190" r="44" fill="none" stroke="#a78bfa" stroke-opacity=".5" stroke-dasharray="20 10">
      <animateTransform attributeName="transform" type="rotate" from="360 980 190" to="0 980 190" dur="12s" repeatCount="indefinite"/></circle>
    <text x="980" y="200" class="m" font-size="28" font-weight="700" fill="#e0f2fe" text-anchor="middle">&lt;/&gt;</text>
    <circle r="5" fill="#22d3ee"><animateMotion dur="6s" repeatCount="indefinite" path="M980 120a70 70 0 1 1 -.1 0"/></circle>
  </g>
</g>
</svg>
